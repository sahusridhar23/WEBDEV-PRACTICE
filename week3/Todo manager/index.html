<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Manager</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="container">
      <!-- header -->
      <header>
        <h1>To-Do</h1>
      </header>

      <hr />

      <main>
        <div class="input-section">
          <!-- input -->
          <label for="input">Add Task</label><br />
          <input
            id="input"
            value="demo task"
            type="text"
            placeholder="eg: start project x"
          />
          <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
          <input type="date" id="duedate" />
          <button id="addbtn">Add</button>
        </div>

        <!-- filters -->
        <h3>filters</h3>
        <div class="filters">
          <button class="filterbtn">All</button>
          <button class="filterbtn">Completed</button>
          <button class="filterbtn">Pending</button>
        </div>

        <!-- task list -->
        <div class="tasklistContainer">
          <h2>TASK list</h2>
          <ul id="tasklist">
            <!-- <li class="taskitem">task1</li> -->
          </ul>
        </div>
      </main>

      <hr />

      <!-- footer -->
      <footer>
        <p>Developed by Sridhar Sahu</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
